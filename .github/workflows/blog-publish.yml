name: Blog Yayın — 1 Mayıs

on:
  schedule:
    # 1 Mayıs 09:00 İstanbul (UTC+3) = 06:00 UTC
    - cron: '0 6 1 5 *'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Blog yayınını etkinleştir
        run: |
          # blogEnabled true yap
          sed -i 's/"blogEnabled": false/"blogEnabled": true/' config/site.config.json
          # blogPostLimit sıfırla (tüm yazılar gösterilsin)
          sed -i 's/"blogPostLimit": 0/"blogPostLimit": 13/' config/site.config.json

      - name: Commit ve push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/site.config.json
          git diff --staged --quiet || git commit -m "feat: 1 Mayıs blog yayını — deri ve ev tekstili makaleleri"
          git push
